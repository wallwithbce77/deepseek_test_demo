name: Offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      USE_FAKE: "1"
      FAKE_ERROR_RATE: "0"
      FAKE_SEED: "7"
      DEEPSEEK_API_KEY: ""
      ARTIFACT_DIR: artifacts/ci/metrics

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline regression tests
        run: >-
          python -m pytest -m "not live"
          --html=artifacts/ci/report.html
          --self-contained-html
          --junitxml=artifacts/ci/junit.xml

      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-test-reports
          path: artifacts/ci/
          if-no-files-found: warn
          retention-days: 14
